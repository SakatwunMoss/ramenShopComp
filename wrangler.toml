# Cloudflare Workers + OpenNext
#
#   npx wrangler kv namespace create NEXT_INC_CACHE_KV
#   npx wrangler r2 bucket create ramen-compare-assets
#   npx wrangler d1 create ramen-compare
#
name = "ramen-compare"
main = ".open-next/worker.js"
compatibility_date = "2024-12-30"
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

[[services]]
binding = "WORKER_SELF_REFERENCE"
service = "ramen-compare"

# ページキャッシュ（ISR / fetch cache）
[[kv_namespaces]]
binding = "NEXT_INC_CACHE_KV"
id = "048ef4c29deb4ef8bdd0e72793428026"
preview_id = "REPLACE_WITH_KV_PREVIEW_ID"

# 大きい静的アセット用
[[r2_buckets]]
binding = "ASSETS_R2"
bucket_name = "ramen-compare-assets"

# 店舗データ（SQLite）
[[d1_databases]]
binding = "DB"
database_name = "ramen-compare"
database_id = "1253e8f0-cfef-4419-96c5-0d1be15dd389"
migrations_dir = "migrations"
