name: Sync HotPepper shops

on:
  schedule:
    # 毎週月曜 03:00 JST (= 日曜 18:00 UTC)
    - cron: "0 18 * * 0"
  workflow_dispatch:
    inputs:
      area:
        description: "大エリアコード（空なら全国）例: Z011"
        required: false
        default: ""
        type: string
      dry_run:
        description: "true の場合は API 取得のみ（D1 へ書き込まない）"
        required: false
        default: false
        type: boolean

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # npm run fetch-shops が --env-file=.env.local を要求するため空ファイルを用意。
      # 実値は下の env 経由で渡す。
      - name: Prepare env file
        run: touch .env.local

      - name: Fetch and upsert shops
        env:
          HOTPEPPER_API_KEY: ${{ secrets.HOTPEPPER_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
        run: |
          set -euo pipefail

          ARGS=()

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            AREA="${{ github.event.inputs.area }}"
            DRY_RUN="${{ github.event.inputs.dry_run }}"

            if [ -n "$AREA" ]; then
              ARGS+=(--area="$AREA")
            fi

            if [ "$DRY_RUN" = "true" ]; then
              ARGS+=(--dry-run)
            fi
          fi

          echo "Running: npm run fetch-shops -- ${ARGS[*]:-}"
          npm run fetch-shops -- "${ARGS[@]}"

      - name: Export shops JSON
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.dry_run != 'true'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
        run: npm run export-shops-json

      # R2 バケット未作成の場合:
      #   npx wrangler r2 bucket create ramen-compare-assets
      - name: Upload shops.json to R2
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.dry_run != 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler r2 object put ramen-compare-assets/shops.json \
            --file=output/shops.json \
            --content-type=application/json \
            --remote