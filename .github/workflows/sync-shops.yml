name: Sync HotPepper shops

on:
  schedule:
    # 毎週月曜 03:00 JST (= 日曜 18:00 UTC)
    - cron: "0 18 * * 0"
  workflow_dispatch:
    inputs:
      area:
        description: "大エリアコード（空なら全国）例: Z011"
        required: false
        default: ""
        type: string
      dry_run:
        description: "true の場合は API 取得のみ（D1 へ書き込まない）"
        required: false
        default: false
        type: boolean

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          check-latest: true
          cache: npm

      - name: Install dependencies
        run: npm ci

      # npm run fetch-shops が --env-file=.env.local を要求するため空ファイルを用意。
      # 実値は下の env 経由で渡す。
      - name: Prepare env file
        run: touch .env.local

      - name: Fetch and upsert shops
        env:
          HOTPEPPER_API_KEY: ${{ secrets.HOTPEPPER_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
        run: |
          set -euo pipefail

          ARGS=()

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            AREA="${{ github.event.inputs.area }}"
            DRY_RUN="${{ github.event.inputs.dry_run }}"

            if [ -n "$AREA" ]; then
              ARGS+=(--area="$AREA")
            fi

            if [ "$DRY_RUN" = "true" ]; then
              ARGS+=(--dry-run)
            fi
          fi

          echo "Running: npm run fetch-shops -- ${ARGS[*]:-}"
          npm run fetch-shops -- "${ARGS[@]}"

      - name: Export shops JSON
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.dry_run != 'true'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
        run: npm run export-shops-json

      # R2 バケット未作成の場合:
      #   npx wrangler r2 bucket create ramen-compare-assets
      - name: Upload shops.json to R2
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.dry_run != 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler r2 object put ramen-compare-assets/shops.json \
            --file=output/shops.json \
            --content-type=application/json \
            --remote

      # --- アフィリエイト商品（店舗更新の後。失敗してもジョブ全体は成功） ---
      - name: Fetch affiliate products
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.dry_run != 'true'
        id: affiliate
        continue-on-error: true
        env:
          AFFILIATE_PROVIDER: yahoo
          YAHOO_CLIENT_ID: ${{ secrets.YAHOO_CLIENT_ID }}
          RAKUTEN_APPLICATION_ID: ${{ secrets.RAKUTEN_APPLICATION_ID }}
          RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
          RAKUTEN_AFFILIATE_ID: ${{ secrets.RAKUTEN_AFFILIATE_ID }}
        run: |
          set -euo pipefail
          if [ -z "${YAHOO_CLIENT_ID:-}" ]; then
            echo "YAHOO_CLIENT_ID が未設定のため商品取得をスキップします"
            exit 0
          fi
          npm run fetch-affiliate-products

      - name: Upload affiliate-products.json to R2
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.dry_run != 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AFFILIATE_PUBLISH: ${{ vars.AFFILIATE_PUBLISH }}
          AFFILIATE_OUTCOME: ${{ steps.affiliate.outcome }}
        run: |
          set -euo pipefail

          if [ "${AFFILIATE_PUBLISH:-}" != "true" ]; then
            echo "商品アップロードをスキップ(AFFILIATE_PUBLISH 未設定)"
            exit 0
          fi

          if [ "${AFFILIATE_OUTCOME}" != "success" ]; then
            echo "商品取得が成功していないため R2 アップロードをスキップします (outcome=${AFFILIATE_OUTCOME})"
            exit 0
          fi

          if [ ! -f output/affiliate-products.json ]; then
            echo "output/affiliate-products.json が無いためアップロードをスキップします"
            exit 0
          fi

          npx wrangler r2 object put ramen-compare-assets/affiliate-products.json \
            --file=output/affiliate-products.json \
            --content-type=application/json \
            --remote
